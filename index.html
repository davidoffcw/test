<meta charset="UTF-8">

<title>Clay</title>
<link rel="stylesheet" href="style.css">

<style>
  .post-card{flex:1 0 auto;display:flex;position:relative;height:35vw;background:linear-gradient(135deg,#1f1f1f,#111) center center;background-size:cover;overflow:hidden;counter-increment:posts;margin:1rem;border-radius:12px}
  @media(max-width:700px){.post-card{flex:1 1 100%;height:70vw}}
  .post-card-large{flex:1 1 100%}
  .post-card-link{flex:1 1 auto;display:block;text-decoration:none}
  .post-card-content{flex:1 1 auto;display:flex;align-items:center;justify-content:center;position:absolute;inset:0;color:#fff;background:#0009;opacity:1;transition:opacity .5s cubic-bezier(.33,0,.2,1)}
  .post-card.with-image .post-card-content{opacity:0}
  @media(max-width:700px){.post-card.with-image .post-card-content{opacity:1}}
  .post-card-link:hover .post-card-content{opacity:1;transition:opacity .3s cubic-bezier(.33,0,.2,1)}
  .post-card-title{margin:0;display:inline-block;font-size:3.4rem;max-width:70%;text-align:center;transition:all .3s cubic-bezier(.33,0,.2,1);text-shadow:0px 0px 6px black;font-family:var(--font-sans-serif);font-variant:small-caps;text-transform:lowercase;font-weight:300}
  .post-card.no-image:before{display:block;content:counter(posts);position:absolute;bottom:-.15em;right:5vw;font-size:28vw;line-height:1em;font-weight:var(--font-heavy);letter-spacing:-.1em;color:#0003}
  .post-card.no-image .post-card-content{justify-content:flex-start;align-items:flex-start;padding:4vw}
  .post-card.no-image .post-card-title{font-size:5rem;line-height:1.15em;text-align:left}
  .post-card.no-image:hover .post-card-title{text-decoration:underline}
  @media(max-width:1200px){.post-card.no-image .post-card-title{font-size:3.4rem}}
  @media(max-width:700px){.post-card.no-image:before{font-size:50vw}}
</style>

<!-- Set theme before first paint to avoid a light/dark flash -->
<script>
  (function () {
    const theme = localStorage.getItem("theme") || "light";
    if (theme === "dark") {
      document.documentElement.setAttribute("data-theme", "dark");
    } else {
      document.documentElement.removeAttribute("data-theme");
    }
  })();
</script>
</head>
